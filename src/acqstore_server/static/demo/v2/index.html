<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcqStore Server API v2 demo</title>
<link rel="stylesheet" href="./css/demo.css">
</head>
<body>
<header class="page-header">
  <h1>AcqStore Server API v2 demo</h1>
  <a href="https://mapmanager.github.io/acqstore-server/users/demo/" target="_blank" rel="noopener noreferrer">Documentation</a>
</header>
<div class="controls">
  <button id="pickBtn" type="button">Open File</button>
  <div id="status" class="status"></div>
</div>
<div id="rangePopover" class="range-popover" hidden role="dialog" aria-label="Display range">
  <h2 id="rangeTitle">Display range</h2>
  <div class="histogram-wrap">
    <canvas id="rangeHistogram" width="300" height="100"></canvas>
  </div>
  <div class="range-fields">
    <label>Min <input id="rangeMin" type="number" step="any"></label>
    <label>Max <input id="rangeMax" type="number" step="any"></label>
    <button id="rangeAuto" type="button">Auto</button>
  </div>
</div>
<div id="imageSplit" class="split-viewport single">
  <section id="sourcePane" class="split-pane split-pane-top">
    <div class="section-heading">
      <h2>Source channels</h2>
      <label id="sourceCompositeControl" class="toggle" hidden>
        <input id="sourceComposite" type="checkbox">
        Composite
      </label>
      <label id="sourceAxesControl" class="toggle" hidden>
        <input id="sourceAxes" type="checkbox">
        Axes
      </label>
    </div>
    <div id="sourceContrast" class="card contrast-panel" hidden></div>
    <div id="channels" class="grid"></div>
  </section>
  <div id="imageSplitDivider" class="split-divider" hidden role="separator" aria-orientation="horizontal" aria-label="Resize source and reference panes"></div>
  <section id="referencePane" class="split-pane split-pane-bottom">
    <div class="section-heading">
      <h2>Reference channels</h2>
      <label id="referenceCompositeControl" class="toggle" hidden>
        <input id="referenceComposite" type="checkbox">
        Composite
      </label>
      <label id="scanPathControl" class="toggle" hidden>
        <input id="showScanPath" type="checkbox" checked>
        Show scan path
      </label>
      <label id="referenceAxesControl" class="toggle" hidden>
        <input id="referenceAxes" type="checkbox">
        Axes
      </label>
    </div>
    <div id="referenceContrast" class="card contrast-panel" hidden></div>
    <div id="references" class="grid"></div>
    <p id="referenceEmpty">No reference image loaded.</p>
  </section>
</div>
<details class="card">
  <summary>AcqStore header</summary>
  <pre id="headerPre">{}</pre>
</details>
<details class="card">
  <summary>Open response</summary>
  <pre id="responsePre">{}</pre>
</details>
<details class="card">
  <summary>Session</summary>
  <pre id="sessionPre">{}</pre>
</details>
<script type="module" src="./js/app.js"></script>
</body>
</html>
