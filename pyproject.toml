[project]
name = "acqstore-server"
version = "0.2.0"
description = "Local HTTP API and optional desktop status UI for opening acquisitions with AcqStore."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Cudmore", email = "robert.cudmore@gmail.com" },
]
keywords = [
    "acquisition",
    "acqstore",
    "fastapi",
    "microscopy",
    "nicegui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
requires-python = ">=3.12"
dependencies = [
    # Sibling source dependency; not published to PyPI. Mapped in [tool.uv.sources].
    "acqstore",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# NiceGUI status window / packaged .app. Embedders (e.g. CloudScope) use core only.
desktop = [
    "nicegui>=3.14.0",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.11",
    # FastAPI TestClient; also useful for local smoke checks.
    "httpx>=0.27.0",
]
# Local dogfood / tests that import status_ui (mirrors [desktop] extra for uv sync).
desktop = [
    "nicegui>=3.14.0",
    "pywebview>=6.2.1",
]
build = [
    "pyinstaller>=6.21.0",
    # packaging/assets/build_icons.sh regenerates .icns/.ico from the master PNG.
    "pillow>=10.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
    # mkdocstrings uses Ruff to format rendered signatures.
    "ruff>=0.15.11",
]

[tool.uv]
# This repo develops the NiceGUI window; CloudScope should depend on core only.
default-groups = ["dev", "desktop"]

[tool.uv.sources]
acqstore = { path = "../acqstore", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# Avoid tests/acqstore_server shadowing the installable acqstore_server package.
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["acqstore_server"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = ["I001"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[project.urls]
Homepage = "https://github.com/mapmanager/acqstore-server"
Repository = "https://github.com/mapmanager/acqstore-server"
Issues = "https://github.com/mapmanager/acqstore-server/issues"
