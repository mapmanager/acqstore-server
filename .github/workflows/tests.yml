# File: .github/workflows/tests.yml
#
# Runs AcqStore Server tests on push and pull request. Checks out a pinned
# AcqStore sibling (not PyPI). Enforces Ruff, pytest coverage, and installed
# wheel validation including packaged static demo assets.

name: Tests
run-name: Tests • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests with coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    defaults:
      run:
        working-directory: acqstore-server

    steps:
      - name: Check out AcqStore Server
        uses: actions/checkout@v4
        with:
          path: acqstore-server
          fetch-depth: 0

      - name: Check out AcqStore
        uses: actions/checkout@v4
        with:
          repository: mapmanager/acqstore
          # Pinned to the verified local acqstore commit at extraction time.
          ref: 5133b6839a225d1ba85b7cd07a852d67e0c82475
          path: acqstore

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version-file: acqstore-server/.python-version

      - name: Validate dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev --group desktop

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest -ra \
            --cov=acqstore_server \
            --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Build distributions
        run: uv build

      - name: Validate installed wheel
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(ls -1 dist/acqstore_server-*.whl | head -1)"
          echo "Wheel: ${WHEEL}"
          CLEAN_VENV="$(mktemp -d)"
          python -m venv "${CLEAN_VENV}"
          # Install sibling AcqStore from source, then the server wheel (no PyPI acqstore).
          "${CLEAN_VENV}/bin/pip" install --upgrade pip
          "${CLEAN_VENV}/bin/pip" install "../acqstore" "${WHEEL}"
          "${CLEAN_VENV}/bin/python" - <<'PY'
          import importlib.resources as resources
          import acqstore
          import acqstore_server

          print("acqstore:", acqstore.__file__)
          print("acqstore_server:", acqstore_server.__file__)

          root = resources.files("acqstore_server")
          demo_v2 = root.joinpath("static/demo/v2/index.html")
          assert demo_v2.is_file(), demo_v2
          from acqstore_server import ServerController

          print("static demo OK:", demo_v2)
          print("ServerController:", ServerController)
          PY
