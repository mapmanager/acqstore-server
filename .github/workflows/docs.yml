#
# File: .github/workflows/docs.yml
#
# MkDocs build and GitHub Pages deploy for AcqStore Server. Pull requests
# build-only (strict validation); pushes to main and manual dispatch deploy
# to https://mapmanager.github.io/acqstore-server/
#
# The docs group includes mkdocstrings, so this workflow still checks out the
# sibling ``acqstore`` editable path dependency declared in pyproject.toml.

name: Docs
run-name: Docs • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # mkdocstrings pages are generated from the v2 source modules.
      - 'src/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: acqstore-server

    steps:
      - name: Check out AcqStore Server
        uses: actions/checkout@v4
        with:
          path: acqstore-server
          fetch-depth: 0

      # Required as a sibling checkout so uv can resolve the editable
      # `acqstore` source dependency declared in pyproject.toml.
      - name: Check out AcqStore
        uses: actions/checkout@v4
        with:
          repository: mapmanager/acqstore
          # Pinned to the verified local acqstore commit at extraction time.
          ref: 5133b6839a225d1ba85b7cd07a852d67e0c82475
          path: acqstore

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: acqstore-server/.python-version

      - name: Validate dependency lock
        run: uv lock --check

      - name: Install documentation dependencies
        run: uv sync --frozen --only-group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: acqstore-server/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
